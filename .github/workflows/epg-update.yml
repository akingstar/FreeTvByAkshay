name: AKSHAY TV EPG Update

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: akshay-tv-epg-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate compact EPG JSON
        run: python scripts/update_epg.py

      - name: Publish EPG data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/epg.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AKSHAY TV EPG guide"
            git push origin HEAD:main
          else
            echo "EPG data unchanged."
          fi
